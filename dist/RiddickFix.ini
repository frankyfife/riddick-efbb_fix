; RiddickFix - The Chronicles of Riddick: Escape From Butcher Bay (Win64 build)
; Lives next to winmm.dll in  System\Win64_AMD64\

[Display]
; 1 = start in the resolution below (0/0 = desktop resolution), 0 = keep the in-game choice
ForceResolution=1
Width=0
Height=0
; 0 = desktop refresh rate (also used for exclusive mode switches)
RefreshRate=0
; skip the display mode change when the game runs at desktop resolution:
; auto = only while Windows HDR is on, 1 = always, 0 = never
Borderless=auto
; game brightness/contrast via the monitor gamma ramp: -1 = auto (ignored while Windows HDR
; is on, it washes out the HDR desktop), 1 = always, 0 = never. Restored on exit (also Alt+F4).
GammaRamp=-1
; projection scale correction, 1.0 = original game (correct Hor+)
FOVFactor=1.0
DPIAware=1
; menus/HUD are a fixed 640x480 canvas stretched to the screen: 1 = draw text and
; button icons pre-squeezed so they keep their proportions on 16:9/21:9
FixUIAspect=1

[Renderer]
; present a short, 2004-compatible OpenGL extension list (fixes the startup crash)
CompatExtensions=1
; RndrGL clamps textures to 2048; 4K screen copies need more (fixes the cut-off/zoomed image)
MaxTextureSize=16384
; auto = 2.0++ (SM3 path, NV_fragment_program2) on NVIDIA, keep = game setting, 0..6 = fixed
ShaderMode=auto
; model detail: high = always the most detailed models (in-game "model quality: high"),
; normal = game default (models swap to low detail early), keep = in-game setting
ModelQuality=high

[Game]
; skip the publisher/developer logo videos at start
SkipIntro=1
; empty = keep the installer setting; Us = English, Ger = German texts/subtitles, Fre = French
Language=Ger

[Audio]
; EAX reverb/occlusion: auto = on when DSOAL (dsound.dll + dsoal-aldrv.dll) sits next to
; SbzEngine.exe, 1/0 = force, keep = in-game setting. Windows itself has no EAX since Vista.
EAX=auto

[Controller]
; right stick through the per-frame mouse path (smooth at high frame rates)
SmoothLook=1
TurnRateX=200
TurnRateY=140
LookCurve=1.8
; native Xbox controller (XInput)
Enable=1
; Xbox button names and icons in texts and menus
XboxPrompts=1
ConsoleMenuHints=1
LookSensitivityX=1.0
LookSensitivityY=1.0
DeadzoneLeft=0.24
DeadzoneRight=0.20
InvertY=0
Vibration=1
VibrationStrength=1.0

[Debug]
EngineLog=0
InputLog=0
