# OpenAL Soft settings for DSOAL (dsound.dll + dsoal-aldrv.dll) in Escape From Butcher Bay.
# Lives next to SbzEngine.exe in System\Win64_AMD64\. Full option list:
# https://github.com/kcat/openal-soft/blob/master/alsoftrc.sample

[general]
# Output layout. Empty = taken from the Windows speaker setup (5.1 when Windows is set to 5.1).
# Force it with: stereo, quad, surround51, surround71
#channels = surround51

# Headphones: auto = HRTF (3D audio) only when Windows reports headphones; true = always
hrtf = auto

frequency = 48000

[eax]
enable = true
